<style>
:root{
  --void:#05080C;
  --panel:#0A0F16;
  --panel-2:#0D1520;
  --cyan:#38E1E8;
  --cyan-dim:rgba(56,225,232,0.14);
  --amber:#FF9F45;
  --amber-dim:rgba(255,159,69,0.14);
  --text:#E8F6F8;
  --muted:#5B7480;
  --online:#34D399;
  --line:rgba(56,225,232,0.16);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Inter',sans-serif;
  background:var(--void);
  color:var(--text);
  line-height:1.6;
  overflow-x:hidden;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(56,225,232,0.07) 0%, transparent 60%),
    linear-gradient(rgba(56,225,232,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(56,225,232,0.025) 1px, transparent 1px);
  background-size:100% 100%, 42px 42px, 42px 42px;
  background-position:0 0, 0 0, 0 0;
}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;line-height:1.15}
.mono{font-family:'IBM Plex Mono',monospace}
.container{max-width:1180px;margin:0 auto;padding:0 2rem}

/* NAV */
nav{position:sticky;top:0;z-index:200;border-bottom:1px solid var(--line);background:rgba(5,8,12,0.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;height:64px}
.nav-brand{display:flex;align-items:center;gap:.65rem;text-decoration:none}
.nav-logo-mark{width:32px;height:32px;border:1px solid var(--cyan);border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--cyan);font-size:1rem;box-shadow:0 0 12px rgba(56,225,232,0.25) inset}
.nav-brand-text{font-family:'IBM Plex Mono',monospace;font-size:.8rem;letter-spacing:.14em;color:var(--text)}
.nav-brand-name{font-family:'Space Grotesk',sans-serif;font-size:1rem;font-weight:600;color:var(--text);letter-spacing:.01em}
.nav-links{display:flex;align-items:center;gap:2rem}
.nav-links a{font-size:.82rem;color:var(--muted);text-decoration:none;font-family:'IBM Plex Mono',monospace;letter-spacing:.03em;transition:color .2s}
.nav-links a:hover{color:var(--cyan)}
.nav-cta{border:1px solid var(--cyan);color:var(--cyan)!important;padding:.45rem 1.1rem;border-radius:4px;transition:background .2s,box-shadow .2s}
.nav-cta:hover{background:var(--cyan-dim);box-shadow:0 0 16px rgba(56,225,232,0.25)}

/* HERO */
.hero{padding:6rem 0 5rem;text-align:center;position:relative}
.status-line{display:inline-flex;align-items:center;gap:.6rem;font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.12em;color:var(--muted);margin-bottom:2.5rem;text-transform:uppercase}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--online);box-shadow:0 0 8px var(--online);animation:pulse-dot 2s infinite}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.35}}
.hero h1{font-size:clamp(2.4rem,6vw,4.2rem);font-weight:700;margin-bottom:1.25rem;letter-spacing:-.01em}
.hero h1 .accent{color:var(--cyan);text-shadow:0 0 24px rgba(56,225,232,0.35)}
.hero-sub{font-size:1.05rem;color:var(--muted);max-width:520px;margin:0 auto 3rem}

/* RADAR SIGNATURE */
.radar-wrap{width:340px;height:340px;margin:0 auto 3rem;position:relative}
.radar-ring{position:absolute;border:1px solid var(--line);border-radius:50%}
.r1{inset:0}
.r2{inset:38px}
.r3{inset:76px}
.r4{inset:114px}
.radar-sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg, rgba(56,225,232,0.35) 0deg, transparent 55deg, transparent 360deg);animation:sweep 4s linear infinite}
@keyframes sweep{to{transform:rotate(360deg)}}
.radar-center{position:absolute;top:50%;left:50%;width:8px;height:8px;background:var(--cyan);border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 14px var(--cyan)}
.radar-blip{position:absolute;width:6px;height:6px;background:var(--amber);border-radius:50%;box-shadow:0 0 10px var(--amber);animation:blip-fade 3s ease-in-out infinite}
@keyframes blip-fade{0%,100%{opacity:.2}50%{opacity:1}}
.radar-label{position:absolute;font-family:'IBM Plex Mono',monospace;font-size:.6rem;color:var(--muted);white-space:nowrap;letter-spacing:.05em}

.hero-ctas{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
.btn{font-family:'IBM Plex Mono',monospace;font-size:.85rem;padding:.85rem 1.75rem;border-radius:6px;text-decoration:none;letter-spacing:.02em;transition:all .2s;display:inline-flex;align-items:center;gap:.5rem}
.btn-primary{background:var(--cyan);color:var(--void);font-weight:600}
.btn-primary:hover{box-shadow:0 0 24px rgba(56,225,232,0.4);transform:translateY(-1px)}
.btn-outline{border:1px solid var(--line);color:var(--text)}
.btn-outline:hover{border-color:var(--cyan);color:var(--cyan)}

/* SECTION SHARED */
.section{padding:5rem 0;border-top:1px solid var(--line)}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);margin-bottom:.75rem}
.section-title{font-size:clamp(1.7rem,3.5vw,2.4rem);font-weight:700;margin-bottom:.75rem}
.section-sub{color:var(--muted);max-width:560px;margin-bottom:2.5rem}

/* CATEGORY TABS */
.cat-tabs{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:2.5rem}
.cat-tab{font-family:'IBM Plex Mono',monospace;font-size:.78rem;padding:.55rem 1.1rem;border-radius:20px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;transition:all .2s;letter-spacing:.02em}
.cat-tab:hover{border-color:var(--cyan);color:var(--text)}
.cat-tab.active{background:var(--cyan-dim);border-color:var(--cyan);color:var(--cyan)}

/* PRODUCT GRID */
.product-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.25rem}
.product-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:1.75rem;text-decoration:none;color:var(--text);transition:border-color .25s,transform .25s,box-shadow .25s;display:flex;flex-direction:column;position:relative;overflow:hidden}
.product-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:0;transition:opacity .25s}
.product-card:hover{border-color:var(--cyan);transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,0.4)}
.product-card:hover::before{opacity:1}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1rem}
.card-name{font-family:'Space Grotesk',sans-serif;font-size:1.1rem;font-weight:600}
.card-live{display:flex;align-items:center;gap:.4rem;font-family:'IBM Plex Mono',monospace;font-size:.62rem;color:var(--online);letter-spacing:.08em}
.card-tagline{font-size:.85rem;color:var(--muted);margin-bottom:1rem;flex:1}
.card-cat{font-family:'IBM Plex Mono',monospace;font-size:.65rem;color:var(--amber);letter-spacing:.06em;text-transform:uppercase}
.card-badges{display:flex;gap:.4rem;margin-bottom:.75rem;flex-wrap:wrap}
.badge{font-family:'IBM Plex Mono',monospace;font-size:.6rem;letter-spacing:.04em;padding:.2rem .5rem;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.badge.llm{border-color:rgba(56,225,232,0.35);color:var(--cyan)}
.badge.auto{border-color:rgba(255,159,69,0.35);color:var(--amber)}
.card-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:auto}
.card-more{font-family:'IBM Plex Mono',monospace;font-size:.68rem;color:var(--muted);background:none;border:none;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px}
.card-more:hover{color:var(--cyan)}

.modal-overlay{position:fixed;inset:0;background:rgba(5,8,12,0.82);backdrop-filter:blur(6px);z-index:500;display:flex;align-items:center;justify-content:center;padding:1.5rem}
.modal-box{background:var(--panel);border:1px solid var(--cyan);border-radius:14px;padding:2rem;max-width:480px;width:100%;box-shadow:0 0 40px rgba(56,225,232,0.15)}
.modal-close{float:right;background:none;border:none;color:var(--muted);font-family:'IBM Plex Mono',monospace;cursor:pointer;font-size:.85rem}
.modal-close:hover{color:var(--cyan)}
.modal-name{font-family:'Space Grotesk',sans-serif;font-size:1.35rem;font-weight:600;margin-bottom:.5rem;clear:both}
.modal-cat{font-family:'IBM Plex Mono',monospace;font-size:.68rem;color:var(--amber);letter-spacing:.06em;text-transform:uppercase;margin-bottom:1rem;display:block}
.modal-desc{color:var(--muted);font-size:.9rem;line-height:1.7;margin-bottom:1.5rem}
.modal-visit{display:inline-flex;align-items:center;gap:.5rem;background:var(--cyan);color:var(--void);font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:.82rem;padding:.7rem 1.4rem;border-radius:6px;text-decoration:none}
.modal-visit:hover{box-shadow:0 0 20px rgba(56,225,232,0.4)}

/* WHY US */
.why-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem}
.why-card{border:1px solid var(--line);border-radius:10px;padding:1.5rem}
.why-num{font-family:'IBM Plex Mono',monospace;color:var(--cyan);font-size:.75rem;margin-bottom:.6rem}
.why-card h3{font-size:1rem;margin-bottom:.5rem}
.why-card p{font-size:.85rem;color:var(--muted)}

/* CONTACT */
.contact-box{border:1px solid var(--line);border-radius:14px;padding:3rem;text-align:center;background:var(--panel)}
.contact-box h2{margin-bottom:.75rem}
.contact-box p{color:var(--muted);margin-bottom:2rem}

/* FOOTER */
footer{border-top:1px solid var(--line);padding:3rem 0 2rem}
.footer-top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:2rem;margin-bottom:2rem}
.footer-links{display:flex;flex-wrap:wrap;gap:1rem 1.5rem;max-width:600px}
.footer-links a{font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--muted);text-decoration:none}
.footer-links a:hover{color:var(--cyan)}
.footer-bottom{font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--muted);border-top:1px solid var(--line);padding-top:1.5rem}

@media(max-width:860px){
  .product-grid{grid-template-columns:1fr 1fr}
  .why-grid{grid-template-columns:1fr}
  .nav-links{display:none}
  .radar-wrap{width:260px;height:260px}
  .r1{inset:0}.r2{inset:28px}.r3{inset:56px}.r4{inset:84px}
}
@media(max-width:560px){
  .product-grid{grid-template-columns:1fr}
  .container{padding:0 1.25rem}
}
@media (prefers-reduced-motion: reduce){
  .radar-sweep,.status-dot,.radar-blip{animation:none}
}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin="anonymous"></script>

<script>
var useState = React.useState;
var useEffect = React.useEffect;
var h = React.createElement;

var CATEGORIES = ['All', 'Work & Productivity', 'Finance & Trading', 'Travel & Lifestyle', 'Health & Fitness', 'Creative Tools', 'Games & Entertainment'];

var PRODUCTS = [
  { id: 'applyedge', name: 'ApplyEdge', url: 'https://applydge.work', tagline: 'AI career tools for global job seekers', description: 'ATS-tuned resume curation, tailored cover letters, and a networking one-pager — built for job seekers applying across ASEAN and global markets.', category: 'Work & Productivity', tags: ['llm'] },
  { id: 'indolearn', name: 'IndoLearn English', url: 'https://indolearn.neulab.xyz', tagline: 'AI English coaching for Indonesian professionals', description: 'An AI-powered English coaching platform built specifically for Indonesian professionals — lessons, listening practice, and progress tracking in one place.', category: 'Work & Productivity', tags: ['llm'] },
  { id: 'casefile', name: 'Case File', url: 'https://intelreport.neulab.xyz', tagline: 'Intelligence research workbench — evidence-grounded subject reports', description: 'A research workbench that ingests recent news and generates evidence-grounded subject reports — built for monitoring and risk-signal tracking.', category: 'Work & Productivity', tags: ['llm', 'auto'] },
  { id: 'linkdeck', name: 'LinkDeck', url: 'https://linkdeck.neulab.xyz', tagline: 'Secure document sharing with real-time tracking', description: 'A DocSend alternative built for Southeast Asia — share PDFs with email gates, track page-by-page viewer analytics, get Telegram alerts, and unlock AI document intelligence. Bilingual EN/ID.', category: 'Work & Productivity', tags: ['llm', 'auto'] },
  { id: 'webdev', name: 'Web Design Studio', url: '#agency', tagline: 'Modern websites for businesses — see our work', description: 'Custom-built and redesigned websites for businesses across Southeast Asia — fast, modern, and designed to convert.', category: 'Work & Productivity', tags: [] },
  { id: 'neural-stocks', name: 'Neural Stock Intelligence', url: 'https://stock.neulab.xyz', tagline: 'AI-powered equity research for retail investors', description: 'LLM-driven stock analysis and signal generation for retail investors, with a horizon-resolved scorecard tracking every call it makes.', category: 'Finance & Trading', tags: ['llm'] },
  { id: 'kidstocks', name: 'KidStocks', url: 'https://kidstocks.net', tagline: 'Stock market literacy for ages 8–18', description: 'The same institutional-grade AI stock analysis as Neural Stocks — translated into age-appropriate language for three age bands (8–10, 11–13, 14–18) via a dedicated Grade Adaptation Layer.', category: 'Finance & Trading', tags: ['llm'] },
  { id: 'idxpaperbot', name: 'IDX Paper Bot', url: 'https://t.me/idxpapertradingbot', tagline: 'Practice IDX trading — zero real money at risk', description: 'A Telegram-based paper trading bot for the Indonesian stock exchange (IDX) — practice real strategies with zero real money at risk.', category: 'Finance & Trading', tags: [] },
  { id: 'duitpintar', name: 'Duitpintar', url: 'https://duitpintar.web.id', tagline: 'Smart personal finance for Indonesia', description: 'A gamified financial literacy platform for Indonesia — modules, virtual portfolio, leaderboard, and AI-powered financial guidance in Bahasa Indonesia.', category: 'Finance & Trading', tags: ['llm'] },
  { id: 'wandr', name: 'Wandr', url: 'https://wandr.neulab.xyz', tagline: 'AI travel planner — with deep Southeast Asian roots', description: 'An AI travel planner that generates and refines full itineraries, with bilingual EN/ID support and local Singapore experience partnerships built in.', category: 'Travel & Lifestyle', tags: ['llm', 'auto'] },
  { id: 'visapath', name: 'VisaPath', url: 'https://visapath.neulab.xyz', tagline: 'AI Visa Intelligence — know before you go', description: 'Check visa requirements between any two countries in seconds — entry rules, required documents, and travel advisories, covering 195+ countries.', category: 'Travel & Lifestyle', tags: ['llm'] },
  { id: 'digitdestiny', name: 'Digit Destiny', url: 'https://digitdestiny.neulab.xyz', tagline: 'Discover the hidden meaning behind your numbers', description: 'A numerology and Chinese zodiac platform blending Life Path analysis with combined synthesis readings — bilingual EN/ID.', category: 'Travel & Lifestyle', tags: ['llm'] },
  { id: 'nutriscan', name: 'NutriScan Indonesia', url: 'https://nutriscan.web.id', tagline: 'The first AI nutrition platform built for Indonesian health', description: 'Scan any Indonesian meal and get component-level nutrition breakdown — built on a vision-AI pipeline reconciled against a national food database.', category: 'Health & Fitness', tags: ['llm'] },
  { id: 'racketfit', name: 'RacketFit', url: 'https://racketfit.uk', tagline: 'Science-backed racket equipment advisor', description: 'An AI equipment advisor covering tennis, badminton, table tennis, and squash — matching your play style to the right racket.', category: 'Health & Fitness', tags: ['llm'] },
  { id: 'doublefit', name: 'DoubleFit', url: 'https://doublefit.racketfit.uk/', tagline: 'AI doubles tennis scheduler & match optimizer', description: 'A doubles tennis scheduling app with live scoring, team mode, and smart round-swapping to keep matches fair and fun.', category: 'Health & Fitness', tags: [] },
  { id: 'ifit-tennis', name: 'iFIT Tennis', url: 'https://tennis.neulab.xyz', tagline: 'Arcade tennis, right in your browser', description: 'A fast, arcade-style tennis game with an 8-player tournament mode — pick your player, pick your court, and play.', category: 'Health & Fitness', tags: [] },
  { id: 'irama', name: 'Irama', url: 'https://irama.neulab.xyz', tagline: 'AI music generation — your genre, your mood', description: 'Generate original tracks by selecting from curated genre and mood presets — ASEAN styles like dangdut and gamelan, or global genres.', category: 'Creative Tools', tags: ['llm'] },
  { id: 'waveshift', name: 'WaveShift', url: 'https://waveshift.neulab.xyz', tagline: 'Convert video and audio — entirely in your browser', description: 'Extract audio from video or convert between formats instantly — runs entirely client-side, so your files never leave your device.', category: 'Creative Tools', tags: [] },
  { id: 'streakle', name: 'Streakle', url: 'https://streakle.neulab.xyz', tagline: 'Daily trivia — five questions, one streak to protect', description: 'A Wordle-style daily trivia challenge with a themed weekly rotation and rising difficulty — five questions a day, no login, no ads, and a streak worth protecting.', category: 'Games & Entertainment', tags: [] }
];

var TAG_LABELS = { llm: 'Custom LLM', auto: 'Automation' };

function RadarSignature() {
  var blips = [
    { top: '18%', left: '65%', delay: '0s', label: 'ApplyEdge' },
    { top: '60%', left: '78%', delay: '.6s', label: 'Wandr' },
    { top: '75%', left: '30%', delay: '1.2s', label: 'Irama' },
    { top: '30%', left: '20%', delay: '1.8s', label: 'Neural Stocks' },
    { top: '48%', left: '52%', delay: '2.4s', label: '' }
  ];
  return h('div', { className: 'radar-wrap' },
    h('div', { className: 'radar-ring r1' }),
    h('div', { className: 'radar-ring r2' }),
    h('div', { className: 'radar-ring r3' }),
    h('div', { className: 'radar-ring r4' }),
    h('div', { className: 'radar-sweep' }),
    h('div', { className: 'radar-center' }),
    blips.map(function (b, i) {
      return h('div', {
        key: i,
        className: 'radar-blip',
        style: { top: b.top, left: b.left, animationDelay: b.delay }
      });
    })
  );
}

function Nav() {
  return h('nav', null,
    h('div', { className: 'container nav-inner' },
      h('a', { href: '#', className: 'nav-brand' },
        h('div', { className: 'nav-logo-mark' }, 'N'),
        h('span', { className: 'nav-brand-name' }, 'Neulab Inc.')
      ),
      h('div', { className: 'nav-links' },
        h('a', { href: '#products' }, 'PRODUCTS'),
        h('a', { href: '#agency' }, 'AGENCY'),
        h('a', { href: '#why-us' }, 'WHY_US'),
        h('a', { href: '#contact', className: 'nav-cta' }, 'CONNECT →')
      )
    )
  );
}

function Hero() {
  return h('section', { className: 'hero container' },
    h('div', { className: 'status-line' },
      h('span', { className: 'status-dot' }),
      'SINGAPORE · EST. 2024 · SYSTEMS ONLINE'
    ),
    h(RadarSignature),
    h('h1', null, 'We build AI products ', h('span', { className: 'accent' }, 'people actually use.')),
    h('p', { className: 'hero-sub' }, 'AI-powered SaaS products and custom AI systems for global and Southeast Asian businesses. Live, revenue-generating, used daily.'),
    h('div', { className: 'hero-ctas' },
      h('a', { href: '#products', className: 'btn btn-primary' }, 'VIEW PRODUCTS →'),
      h('a', { href: '#contact', className: 'btn btn-outline' }, 'WORK WITH US')
    )
  );
}

function ProductModal(props) {
  var p = props.product;
  if (!p) return null;
  var isInternal = p.url.indexOf('#') === 0;
  return h('div', { className: 'modal-overlay', onClick: props.onClose },
    h('div', { className: 'modal-box', onClick: function (e) { e.stopPropagation(); } },
      h('button', { className: 'modal-close', onClick: props.onClose }, 'CLOSE ✕'),
      h('div', { className: 'modal-name' }, p.name),
      h('span', { className: 'modal-cat' }, p.category),
      h('div', { className: 'card-badges' },
        p.tags.map(function (t) {
          return h('span', { key: t, className: 'badge ' + t }, TAG_LABELS[t]);
        })
      ),
      h('p', { className: 'modal-desc' }, p.description),
      h('a', {
        href: p.url,
        className: 'modal-visit',
        target: isInternal ? undefined : '_blank',
        rel: isInternal ? undefined : 'noopener'
      }, isInternal ? 'View work →' : 'Visit product →')
    )
  );
}

function Products() {
  var catState = useState('All');
  var active = catState[0];
  var setActive = catState[1];
  var modalState = useState(null);
  var openProduct = modalState[0];
  var setOpenProduct = modalState[1];
  var filtered = active === 'All' ? PRODUCTS : PRODUCTS.filter(function (p) { return p.category === active; });

  return h('section', { className: 'section', id: 'products' },
    h('div', { className: 'container' },
      h('div', { className: 'eyebrow' }, '// PRODUCT_INDEX'),
      h('h2', { className: 'section-title' }, 'Live systems'),
      h('p', { className: 'section-sub' }, 'Every product below is deployed, revenue-tracked, and used by real people today. Filter by category, or click a card for details.'),
      h('div', { className: 'cat-tabs' },
        CATEGORIES.map(function (cat) {
          return h('button', {
            key: cat,
            className: 'cat-tab' + (active === cat ? ' active' : ''),
            onClick: function () { setActive(cat); }
          }, cat.toUpperCase());
        })
      ),
      h('div', { className: 'product-grid' },
        filtered.map(function (p) {
          var isInternal = p.url.indexOf('#') === 0;
          var cardProps = { key: p.id, href: p.url, className: 'product-card' };
          if (!isInternal) { cardProps.target = '_blank'; cardProps.rel = 'noopener'; }
          return h('a', cardProps,
            h('div', { className: 'card-top' },
              h('span', { className: 'card-name' }, p.name),
              isInternal
                ? h('span', { className: 'card-live mono' }, 'VIEW WORK →')
                : h('span', { className: 'card-live' }, h('span', { className: 'status-dot' }), 'LIVE')
            ),
            h('p', { className: 'card-tagline' }, p.tagline),
            p.tags.length > 0 ? h('div', { className: 'card-badges' },
              p.tags.map(function (t) {
                return h('span', { key: t, className: 'badge ' + t }, TAG_LABELS[t]);
              })
            ) : null,
            h('div', { className: 'card-bottom' },
              h('span', { className: 'card-cat' }, p.category),
              h('button', {
                className: 'card-more',
                onClick: function (e) { e.preventDefault(); e.stopPropagation(); setOpenProduct(p); }
              }, 'DETAILS')
            )
          );
        })
      )
    ),
    h(ProductModal, { product: openProduct, onClose: function () { setOpenProduct(null); } })
  );
}
